name: Temporary lockfile bootstrap

on:
  push:
    branches: ["fix/u4-lockfile"]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - name: Generate npm lockfile
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          mkdir -p lock-artifact
          cp package-lock.json lock-artifact/package-lock.json
          {
            node --version
            npm --version
          } > lock-artifact/toolchain.txt
      - name: Commit generated lockfile to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
          else
            git commit -m "Add npm lockfile generated with Node 26.13.1 and npm 11.20.0"
            git push origin HEAD:fix/u4-lockfile
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: u4-npm-lockfile
          path: lock-artifact/
          retention-days: 1
      - name: Verify clean lockfile installation
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
